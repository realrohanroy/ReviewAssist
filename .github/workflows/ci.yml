name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test & Build Validation
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: ci_test_jwt_secret_must_be_at_least_32_characters_long
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/review_collector?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/backend/prisma/schema.prisma

      - name: Run Test Suites (Vitest)
        run: npm test

      - name: Compile & Build Workspaces
        run: npm run build
